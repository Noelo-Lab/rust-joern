[package]
name = "rust-joern"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Native C/C++ code property graphs with PyJoern-compatible CFGs"

[lib]
name = "rust_joern"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rust-joern"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1
