[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rust-joern"
version = "0.1.0"
description = "In-process C/C++ code property graphs with PyJoern-compatible CFGs"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["networkx>=3", "orjson>=3.13"]

[project.optional-dependencies]
parity = ["igraph>=1.0.0"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
rust_joern = ["*.so", "*.dylib", "*.dll"]
